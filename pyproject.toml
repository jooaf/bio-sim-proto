[project]
name = "conserved-program-soup"
version = "0.1.0"
description = "Research simulator for conserved self-modifying program soups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "brotli>=1.1",
  "numba>=0.61",
  "numpy>=2.0,<2.3",
  "pandas>=2.2",
  "pyarrow>=17",
  "pygame-ce>=2.5",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.0",
]

[project.scripts]
soup-run = "experiments.runner:main"
soup-report = "analysis.report:main"
soup-viz = "soup.viz.app:main"
soup-paper-probe = "experiments.paper_probe:main"
soup-spatial-report = "analysis.spatial:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soup", "analysis", "experiments"]

[tool.hatch.build.targets.sdist]
include = [
  "/soup",
  "/analysis",
  "/experiments",
  "/tests",
  "/README.md",
  "/FINDINGS.md",
  "/pyproject.toml",
]
exclude = [
  "/experiments/phase1_runs",
  "/experiments/replicator_length_study/results",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "ipykernel>=7.3.0",
  "jupyterlab>=4.6.3",
  "matplotlib>=3.11.1",
  "mypy>=1.11",
  "nbclient>=0.11.0",
  "nbformat>=5.11.0",
  "pandas-stubs>=2.2",
  "pytest>=8.0",
  "tabulate>=0.10.0",
]
