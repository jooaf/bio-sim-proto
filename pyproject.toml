[project]
name = "conserved-program-soup"
version = "0.1.0"
description = "Research simulator for conserved self-modifying program soups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2",
  "pyarrow>=17",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
viz = ["pygame-ce>=2.5"]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.0",
]

[project.scripts]
soup-run = "experiments.runner:main"
soup-report = "analysis.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soup", "analysis", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.0",
]
