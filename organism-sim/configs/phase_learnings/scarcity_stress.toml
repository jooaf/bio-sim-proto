# Phase-learnings profile: strong-scarcity stress condition.
#
# bio-sim-proto phase 1 analog: pool multiplier 0.5 — a strong but dynamic
# constraint where blocking is frequent and broad. Expect resource blocks to
# dominate reproduction failures; use this arm to stress the matter economy.
# Everything except the scarcity knobs matches scarcity_moderate.toml so the
# panel compares cleanly across seeds.

[run]
ticks = 8000

[simulation]
seed = 7
founder_count = 300
founder_archetype_count = 8
initial_deposits = 1300
deposit_production_rate = 0.05
deposit_match_ecology = false
mutation_multiplier = 1.0
