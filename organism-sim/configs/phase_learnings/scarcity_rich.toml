# Phase-learnings profile: near-unconstrained control.
#
# bio-sim-proto phase 1 analog: pool multiplier 16 — near-unconstrained on
# average but still capable of rare blocking bursts. Use as the comparison
# arm when testing whether the scarcity regime, rather than scale, drives an
# observed effect.

[run]
ticks = 8000

[simulation]
seed = 7
founder_count = 300
founder_archetype_count = 8
initial_deposits = 5200
deposit_production_rate = 0.20
deposit_match_ecology = false
mutation_multiplier = 1.0
